[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot-attention-visualizer"
version = "0.1.1"
description = "Stream attention / activation heatmaps from lerobot policies to rerun, live or from a recorded dataset."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Lucas Wendland", email = "mtglucas1@gmail.com" }]
keywords = ["lerobot", "robotics", "interpretability", "attention", "rerun", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "lerobot>=0.5.1,<0.6.0",
    "numpy",
    "rerun-sdk",
    "torch",
]

[project.urls]
Homepage = "https://github.com/CursedRock17/lerobot_attention_visualizer"
Repository = "https://github.com/CursedRock17/lerobot_attention_visualizer"
"Bug Tracker" = "https://github.com/CursedRock17/lerobot_attention_visualizer/issues"

[project.optional-dependencies]
# Policy extras — pull lerobot's matching extras transitively. ACT has no
# extra (it's in core lerobot), so there's no `act` key here.
smolvla = ["lerobot[smolvla]>=0.5.1,<0.6.0"]
pi = ["lerobot[pi]>=0.5.1,<0.6.0"]
wallx = ["lerobot[wallx]>=0.5.1,<0.6.0"]
xvla = ["lerobot[xvla]>=0.5.1,<0.6.0"]
# Robot / camera extras.
feetech = ["lerobot[feetech]>=0.5.1,<0.6.0"]
aloha = ["lerobot[aloha]>=0.5.1,<0.6.0"]
intelrealsense = ["lerobot[intelrealsense]>=0.5.1,<0.6.0"]
# Everything lerobot ships.
all = ["lerobot[all]>=0.5.1,<0.6.0"]
# Development tooling — pytest only for now; tests are self-contained and
# don't require any of the policy extras.
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_attention_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
