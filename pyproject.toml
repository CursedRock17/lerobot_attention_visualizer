[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot-attention-visualizer"
version = "0.1.2"
description = "Stream attention / activation heatmaps from lerobot policies to rerun, live or from a recorded dataset."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Lucas Wendland", email = "mtglucas1@gmail.com" }]
keywords = ["lerobot", "robotics", "interpretability", "attention", "rerun", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Pinned to pair with lerobot v0.6.0, which requires Python >=3.12,
# torch>=2.7,<2.12, numpy>=2.0,<2.3 and huggingface-hub>=1.0. Note that v0.6.0
# ships a minimal default install — policy deps (incl. transformers>=5.4,<5.6)
# come from the extras below, not from `pip install lerobot` alone.
dependencies = [
    "lerobot>=0.6.0,<0.7.0",
    "numpy>=2.0",
    "rerun-sdk",
    "torch>=2.7",
]

[project.urls]
Homepage = "https://github.com/CursedRock17/lerobot_attention_visualizer"
Repository = "https://github.com/CursedRock17/lerobot_attention_visualizer"
"Bug Tracker" = "https://github.com/CursedRock17/lerobot_attention_visualizer/issues"

[project.optional-dependencies]
# Policy extras — pull lerobot's matching extras transitively. ACT has no
# extra (it's in core lerobot), so there's no `act` key here.
smolvla = ["lerobot[smolvla]>=0.6.0,<0.7.0"]
pi = ["lerobot[pi]>=0.6.0,<0.7.0"]
# Robot / camera extras.
feetech = ["lerobot[feetech]>=0.6.0,<0.7.0"]
aloha = ["lerobot[aloha]>=0.6.0,<0.7.0"]
intelrealsense = ["lerobot[intelrealsense]>=0.6.0,<0.7.0"]
# Convenience bundle — installs all supported policy + hardware extras.
all = ["lerobot-attention-visualizer[smolvla,pi,feetech,aloha,intelrealsense]"]
# Development tooling.
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_attention_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
